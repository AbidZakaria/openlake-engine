name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt fastapi==0.115.12 ruff==0.6.9
      - run: ruff check openlake dashboard tests
      - run: python -m pytest -q -m "not spark and not integration"

  spark:
    name: Spark + Iceberg tests (hermetic pipeline)
    runs-on: ubuntu-latest
    env:
      # Iceberg runtime pulled from Maven; tests use a filesystem catalog, no services.
      OPENLAKE_SPARK_PACKAGES: org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.10.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyspark==4.0.1
      - run: python -m pytest -q -m spark

  images:
    name: docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
