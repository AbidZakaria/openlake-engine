name: dashboard (GitHub Pages)

# Publishes dashboard/static — including the JSON snapshot exported from a real
# run by `make export-static` — as a static site. The page detects that /api is
# absent and reads the snapshot instead.
on:
  push:
    branches: [main]
    paths: ["dashboard/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/static
      - id: deployment
        uses: actions/deploy-pages@v4
